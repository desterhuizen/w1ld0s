---
# Actions are pinned by commit SHA, which is what makes them tamper-proof and
# also what makes them rot silently. This is the other half of that policy.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Do not propose a release the day it is published. That window is exactly
    # when a compromised or hijacked tag is still unnoticed, and taking the
    # bump a week late costs nothing here.
    cooldown:
      default-days: 7
