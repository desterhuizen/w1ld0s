# w1ld0s static file host — installed to /etc/nginx/sites-available/w1ld0s by
# modules/35-webserver.sh, which also unhooks the stock 'default' site.
#
# Serves /var/www/html and tries to say as little else as possible: no version,
# no product name, no directory listings, no stock error pages, no mtimes.
#
# Lines tagged '# needs headers-more' are stripped by the module when
# libnginx-mod-http-headers-more-filter is not installed — more_* would be
# unknown directives there and nginx would refuse to start at all.

server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;

    # ---- fingerprint reduction ---------------------------------------------
    server_tokens off;   # version out of Server: and out of the error bodies
    etag off;            # ETag is mtime+size — a build fingerprint on a payload
    autoindex off;       # no directory listing; fetch files by name

    more_clear_headers 'Server';         # needs headers-more
    more_clear_headers 'Date';           # needs headers-more
    more_clear_headers 'Last-Modified';  # needs headers-more

    # What survives on a 200: Content-Type, Content-Length, Connection,
    # Accept-Ranges. Accept-Ranges stays on purpose — clearing the header does
    # not stop range requests, it only breaks resuming a large download.

    # ---- everything that is not a real file is a bodyless 404 ---------------
    # No stock nginx error page, and no way for a scanner to tell 403 from 404
    # from 500. recursive_error_pages is off by default, so the named location
    # below is not itself intercepted.
    error_page 400 401 402 403 404 405 406 408 409 410 411 412 413 414 415 416
               417 418 421 422 423 424 425 426 428 429 431 451
               500 501 502 503 504 505 506 507 508 510 511 = @blank;
    location @blank { return 404 ''; }

    location / {
        limit_except GET HEAD { deny all; }   # POST/PUT/etc land on @blank
        try_files $uri $uri/index.html =404;  # index.html only if you drop one in
    }

    # Access logs are kept: they are the record of which target pulled which
    # payload and when. The leak this file is about is what the CLIENT sees.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
